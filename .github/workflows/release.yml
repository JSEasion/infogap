name: 桌面版发布构建

# 推送 v* 标签时构建 macOS(arm64/x64) + Windows 安装包并附到 GitHub Release
# 也可在 Actions 页手动触发（workflow_dispatch），产物在 Artifacts 下载
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, platform: mac-arm64 }   # Apple Silicon
          - { os: macos-13, platform: mac-x64 }     # Intel（最后的 x64 镜像）
          - { os: windows-latest, platform: win-x64 }
    runs-on: ${{ matrix.os }}
    env:
      APP_ARCH: ${{ matrix.platform }}  # dmg 文件名按架构区分后缀
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: python -m pip install -e .[desktop,pack]

      - name: 生成图标（仅 macOS，Windows 用仓库里的 .ico）
        if: runner.os == 'macOS'
        run: python scripts/make_app_icons.py

      - name: 构建（macOS）
        if: runner.os == 'macOS'
        run: bash packaging/build_mac.sh python

      - name: 构建（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: infogap-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/InfoGap-Setup-*.exe
            dist/InfoGap-win64.zip
          if-no-files-found: error

      - name: 附到 Release（仅打标签时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/InfoGap-Setup-*.exe
            dist/InfoGap-win64.zip
